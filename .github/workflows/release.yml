# SPDX-License-Identifier: GPL-3.0-or-later WITH AdditionRef-RGBMatrixFX-plugin-exception
# SPDX-FileCopyrightText: © 2026 Nitrofire Computing
# Build the free-version packages for a version tag and attach them to a GitHub Release.
#   git tag v1.1.0 && git push origin v1.1.0       -> release "RGBMatrixFX 1.1.0"
#   v1.1.0-rc.1 (any tag with "-")                   -> marked as a pre-release
# The tag must match rgbmatrixfx/__init__.py (__version__) exactly, without the "v".
name: Release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      tag:
        description: "Existing tag to (re)build, e.g. v1.1.0. Packages are built; nothing is published."
        required: true

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

env:
  TAG: ${{ github.event.inputs.tag || github.ref_name }}

jobs:
  check:
    name: Check version and lint
    runs-on: ubuntu-24.04
    outputs:
      version: ${{ steps.v.outputs.version }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ env.TAG }}
      - id: v
        name: Tag matches __version__
        run: |
          v="$(packaging/version.sh upstream)"
          if [ "v$v" != "$TAG" ]; then
            echo "::error::tag $TAG does not match __version__ $v in rgbmatrixfx/__init__.py"; exit 1
          fi
          [ "$(cat VERSION)" = "$v" ] || { echo "::error::VERSION file says $(cat VERSION), __version__ says $v"; exit 1; }
          echo "version=$v" >> "$GITHUB_OUTPUT"
      - name: Lint
        run: |
          sudo apt-get update -q && sudo apt-get install -y -q shellcheck appstream desktop-file-utils
          shellcheck -s sh packaging/*.sh packaging/appimage/*.sh packaging/appimage/AppRun packaging/aur/*.sh
          shellcheck install.sh uninstall.sh
          appstreamcli validate --no-net packaging/*.metainfo.xml
          sed 's|^Exec=.*|Exec=rgbmatrixfx|' data/rgbmatrixfx.desktop.in > /tmp/rgbmatrixfx.desktop && desktop-file-validate /tmp/rgbmatrixfx.desktop

  deb:
    name: .deb (Debian 13 / Ubuntu 25.10+)
    needs: check
    runs-on: ubuntu-24.04
    container: debian:trixie
    steps:
      - run: apt-get update -q && apt-get install -y -q --no-install-recommends git ca-certificates build-essential debhelper dh-python python3 devscripts lintian
      - uses: actions/checkout@v4
        with:
          ref: ${{ env.TAG }}
      - run: git config --global --add safe.directory "$GITHUB_WORKSPACE"
      - run: packaging/build-deb.sh
      - name: Install test
        run: |
          apt-get install -y -q --no-install-recommends ./dist/rgbmatrixfx_*_all.deb
          test -x /usr/bin/rgbmatrixfx && test -f /usr/lib/systemd/user/rgbmatrixfx-engine.service
          python3 -c "import sys; sys.path.insert(0, '/usr/share/rgbmatrixfx'); import rgbmatrixfx.engine, rgbmatrixfx.gui.app; print(rgbmatrixfx.__version__)"
      - uses: actions/upload-artifact@v4
        with:
          name: deb
          path: dist/*.deb
          if-no-files-found: error

  rpm:
    name: .rpm (Fedora)
    needs: check
    runs-on: ubuntu-24.04
    container: fedora:latest
    steps:
      - run: dnf install -y -q git rpm-build rpmlint python3-devel systemd-rpm-macros
      - uses: actions/checkout@v4
        with:
          ref: ${{ env.TAG }}
      - run: git config --global --add safe.directory "$GITHUB_WORKSPACE"
      - run: packaging/build-rpm.sh
      - uses: actions/upload-artifact@v4
        with:
          name: rpm
          path: dist/*.rpm
          if-no-files-found: error

  appimage:
    name: AppImage (x86_64)
    needs: check
    # oldest supported runner: the bundled dbus-python/evdev are built against glibc 2.35
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ env.TAG }}
      # libegl1 and libgl1: the AppImage smoke test imports PySide6 (Qt6Gui needs them).
      # They stay on the host; the AppImage does not bundle OpenGL.
      - run: sudo apt-get update -q && sudo apt-get install -y -q libdbus-1-dev libglib2.0-dev pkg-config libegl1 libgl1 libxkbcommon0 libfontconfig1
      - uses: actions/cache@v4
        with:
          path: build/appimage/cache
          key: appimage-cache-${{ hashFiles('packaging/appimage/build-appimage.sh') }}
      - run: packaging/appimage/build-appimage.sh
      - uses: actions/upload-artifact@v4
        with:
          name: appimage
          path: dist/*.AppImage
          if-no-files-found: error

  aur:
    name: AUR PKGBUILD
    needs: check
    runs-on: ubuntu-24.04
    container: archlinux:latest
    steps:
      - run: pacman -Syu --noconfirm --needed base-devel git namcap
      - uses: actions/checkout@v4
        with:
          ref: ${{ env.TAG }}
      - name: PKGBUILD for the tag tarball, test build as a normal user
        run: |
          git config --global --add safe.directory "$GITHUB_WORKSPACE"
          useradd -m builder
          chown -R builder "$GITHUB_WORKSPACE"
          su builder -c "cd '$GITHUB_WORKSPACE' && SOURCE_REPO='https://github.com/${{ github.repository }}' packaging/aur/make-pkgbuild.sh"
          su builder -c "cd '$GITHUB_WORKSPACE/build/aur' && makepkg -f --nodeps --noconfirm"
          namcap build/aur/PKGBUILD build/aur/*.pkg.tar.* || true
          v="$(packaging/version.sh upstream)"
          tar -C build/aur -czf "dist-rgbmatrixfx-$v-aur.tar.gz" PKGBUILD .SRCINFO
          mkdir -p dist && mv "dist-rgbmatrixfx-$v-aur.tar.gz" "dist/rgbmatrixfx-$v-aur.tar.gz"
      - uses: actions/upload-artifact@v4
        with:
          name: aur
          path: dist/*-aur.tar.gz
          if-no-files-found: error

  release:
    name: GitHub Release
    needs: [check, deb, rpm, appimage, aur]
    if: github.event_name == 'push'
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ env.TAG }}
      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true
      - name: Examples download (preset template, layout pack template, docs)
        run: |
          v="${{ needs.check.outputs.version }}"
          zip -q -r "dist/rgbmatrixfx-$v-examples.zip" examples/presets examples/layouts docs/LAYOUTS.md
      - name: Checksums and notes
        run: |
          cd dist && sha256sum -- * > SHA256SUMS && cat SHA256SUMS && cd ..
          v="${{ needs.check.outputs.version }}"
          # this version's section of CHANGELOG.md, if there is one
          awk -v v="$v" '$0 ~ "^## \\[" v "\\]" {on=1; next} on && /^## \[/ {exit} on' CHANGELOG.md > notes.md
          printf '\n---\nChecksums: SHA256SUMS. Not affiliated with or endorsed by Razer Inc.\n' >> notes.md
      - name: Create the release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          v="${{ needs.check.outputs.version }}"
          pre=""
          case "$TAG" in *-*) pre="--prerelease" ;; esac
          # shellcheck disable=SC2086
          gh release create "$TAG" dist/* --title "RGBMatrixFX $v" --notes-file notes.md --generate-notes $pre --verify-tag
